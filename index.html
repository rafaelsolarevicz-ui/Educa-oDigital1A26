<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Meu blog tech</title>
  <style>
    /* Cabeçalho */
    header {
      background-color: #007BFF;
      color: white;
      text-align: center;
      padding: 20px;
    }

    /* Limita a largura da página e centraliza */
    main {
      display: flex;           /* Flexbox para alinhar horizontalmente */
      max-width: 800px;        /* Limita a largura do conteúdo */
      margin: 20px auto;       /* Centraliza na página */
      gap: 20px;               /* Espaço entre imagem e texto */
      align-items: flex-start; /* Alinha topo da imagem com topo do texto */
    }

    /* Estilo da imagem */
    main img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 5px;
    }

    /* Bloco de texto ao lado da imagem */
    main div {
      display: flex;
      flex-direction: column; /* Mantém h2 e parágrafos em coluna */
      gap: 5px;
    }

    /* Apenas o parágrafo do autor em negrito */
    .artigo-autor {
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <h1>Meu blog tech</h1>
    <p>Vou compartilhar conhecimentos sobre tecnologia e programação</p>
  </header>

  <main>
    <!-- Imagem de exemplo online; você pode trocar pela sua -->
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6a/Book_icon_2.svg/120px-Book_icon_2.svg.png" 
         alt="Logotipo de tecnologia e educação com livro e cérebro digital">
    <div>
      <h2>Meu primeiro post</h2>
      <p class="artigo-autor">Por: Rafael Solarevicz</p>
      <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação e curiosidades da área de tecnologia.</p>
    </div>
  </main>

</body>
</html>
